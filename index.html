<!DOCTYPE html>
<html lang="es">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Zona GAMER "Consolas y Videojuegos"</title>
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
 <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
 <style>.card{transition:transform .15s}.card:hover{transform:translateY(-3px)}.fav{cursor:pointer;font-size:1.3rem}</style>
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark sticky-top">
 <div class="container flex-wrap gap-2">
     <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-controller"></i> GameZone</a>
     <div class="d-flex flex-wrap gap-1" id="menu"></div>
     <div class="d-flex align-items-center gap-2" id="usuario"></div>
 </div>
</nav>

<div class="container my-4">
  <div class="p-4 mb-4 rounded text-white" style="background:linear-gradient(135deg,#1e3c72,#7b2ff7)">
     <h2 class="fw-bold m-0">Consolas, juegos y accesorios</h2>
     <p class="m-0 opacity-75">PlayStation, Xbox y Nintendo al mejor precio</p>
   </div>
  <div id="vista"></div>
</div>

<div class="modal fade" id="mLogin" tabindex="-1">
 <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
      <form id="fAuth">
         <div class="modal-header"><h5 class="modal-title" id="tLogin">Iniciar sesión</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
              <div class="mb-3 d-none" id="gNombre"><label class="form-label">Nombre</label><input id="nombre" class="form-control"></div>
              <div class="mb-3"><label class="form-label">Correo</label><input id="email" type="email" class="form-control" required></div>
              <div class="mb-3"><label class="form-label">Contraseña</label><input id="password" type="password" class="form-control" required></div>
              <div class="text-danger small" id="err"></div>
              <a href="#" class="small" id="alt" onclick="alternar();return false"></a>
            </div>
            <div class="modal-footer"><button type="submit" class="btn btn-primary" id="btnAuth">Entrar</button></div>
        </form>
    </div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
