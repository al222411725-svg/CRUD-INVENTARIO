<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zona GAMER - Administración</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand fw-bold">GameZone · Panel</span>
        <div class="d-flex align-items-center gap-2"><span class="text-white small" id="usr"></span>
        <a class="btn btn-sm btn-outline-light" href="index.html">Ver tienda</a></div>
    </div>
</nav>

<div class="container my-4">
    <h4>Productos y ofertas</h4>
    <div class="card mb-3 shadow-sm"><div class="card-body">
        <form id="fp" class="row g-2">
            <input type="hidden" id="pid">
            <div class="col-md-3"><label class="form-label">Nombre</label><input id="pn" class="form-control" required></div>
            <div class="col-md-2"><label class="form-label">Categoría</label><select id="pc" class="form-select">
                <option>PlayStation</option><option>Xbox</option><option>Nintendo</option><option>Juegos</option><option>Accesorios</option></select></div>
            <div class="col-md-2"><label class="form-label">Precio ($)</label><input id="pp" type="number" step="0.01" min="0" class="form-control" required></div>
            <div class="col-md-2"><label class="form-label">Oferta (%)</label><input id="pd" type="number" min="0" max="90" value="0" class="form-control"></div>
            <div class="col-md-1"><label class="form-label">Stock</label><input id="ps" type="number" min="0" class="form-control" required></div>
            <div class="col-md-2 d-flex align-items-end"><button class="btn btn-primary w-100" id="bp">Guardar</button></div>
        </form></div></div>
    <div class="card shadow-sm mb-5"><div class="card-body"><table class="table table-hover align-middle m-0">
        <thead class="table-dark"><tr><th>ID</th><th>Producto</th><th>Categoría</th><th>Precio</th><th>Oferta</th><th>Stock</th><th>Acciones</th></tr></thead>
        <tbody id="tp"></tbody></table></div></div>

    <div id="secEmp" class="d-none">
        <h4>Empleados</h4>
        <div class="card mb-3 shadow-sm"><div class="card-body">
            <form id="fe" class="row g-2">
                <div class="col-md-3"><label class="form-label">Nombre</label><input id="en" class="form-control" required></div>
                <div class="col-md-3"><label class="form-label">Correo</label><input id="ee" type="email" class="form-control" required></div>
                <div class="col-md-2"><label class="form-label">Contraseña</label><input id="ec" type="password" minlength="6" class="form-control" required></div>
                <div class="col-md-2"><label class="form-label">Puesto</label><input id="eu" class="form-control"></div>
                <div class="col-md-1"><label class="form-label">Teléfono</label><input id="et" class="form-control"></div>
                <div class="col-md-1 d-flex align-items-end"><button class="btn btn-primary w-100">Agregar</button></div>
            </form></div></div>
        <div class="card shadow-sm"><div class="card-body"><table class="table table-hover align-middle m-0">
            <thead class="table-dark"><tr><th>ID</th><th>Nombre</th><th>Correo</th><th>Puesto</th><th>Teléfono</th><th></th></tr></thead>
            <tbody id="te"></tbody></table></div></div>
    </div>
</div>
<script src="admin.js"></script>
</body>
</html>
